# pg_hba-starter.conf
# A small, fictional host-based authentication file for Skills Lab 2A.
# Read it, then copy it into your answer file and edit it there. Do not
# copy it onto a real server.
#
# PostgreSQL reads this file top to bottom and uses the FIRST line whose
# TYPE, DATABASE, USER, and ADDRESS all match the incoming connection.
# If no line matches, the connection is refused. Order is a decision.
#
# The five columns:
#   TYPE      how the client arrived: local (same machine, no network),
#             host (TCP, encrypted or not), hostssl (TCP with TLS only)
#   DATABASE  which database the rule covers: a name, all, replication
#   USER      which role the rule covers: a name, all, or +groupname
#   ADDRESS   which client addresses match, as address/prefix-length
#             (blank for local rules, which have no network address)
#   METHOD    how identity is proven: scram-sha-256 (default), cert,
#             reject (refuse), trust (no proof at all: laptops only)
#
# Addresses in this file are fictional:
#   10.40.20.0/24   the application tier (scheduling app, reminder job)
#   10.40.5.15      the Copperwind administrator jump host
#   10.60.0.0/16    the clinic's own office network (staff workstations)

# TYPE  DATABASE         USER        ADDRESS            METHOD

# Local maintenance from the server itself, superuser only.
local   all              postgres                       scram-sha-256

# Loopback connections for tools that run on the server.
host    all              all         127.0.0.1/32       scram-sha-256
host    all              all         ::1/128            scram-sha-256

# Left over from the pilot. Any address, any database, any role.
host    all              all         0.0.0.0/0          scram-sha-256

