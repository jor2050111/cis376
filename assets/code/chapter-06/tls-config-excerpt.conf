# Chapter 6, Section 6.3: the lines that turn TLS on and require it.
# Copy each block into the file it names. Do not replace your files
# with this one.

# ---- postgresql.conf ----------------------------------------------
# ssl cannot be reloaded. Restart the server after adding these.
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'

# ---- pg_hba.conf --------------------------------------------------
# Put these ABOVE any host rule that could match the same client, then
# SELECT pg_reload_conf(); The reject line catches every plain TCP
# connection that reaches it. Change the database and role names for
# the academy lab (harquahala_academy, academy_portal_app).
# TYPE      DATABASE         USER                ADDRESS         METHOD
hostssl     sandwash_clinic  clinic_billing_app  127.0.0.1/32    scram-sha-256
hostnossl   all              all                 0.0.0.0/0       reject
